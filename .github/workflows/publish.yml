name: Publish package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package index
        required: true
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        run: |
          python3 - <<'PY'
          import os
          ref = os.environ['GITHUB_REF']
          if not ref.startswith('refs/tags/v'):
              raise SystemExit('Select a version tag, such as v0.1.0a1, before publishing.')
          PY
  tests:
    needs: release-tag
    permissions:
      contents: write
    uses: ./.github/workflows/tests.yml
  publish:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check release contents and installed behavior
        run: python scripts/check_dist.py dist --expected-version "${GITHUB_REF_NAME#v}"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
