name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import tkinter"
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest
      - if: runner.os != 'Linux'
        run: python -m pytest
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_dist.py dist
