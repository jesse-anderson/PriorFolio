name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import tkinter"
      - if: runner.os == 'Linux' && matrix.python == '3.12'
        run: xvfb-run -a python -m pytest --cov --cov-report=term-missing --cov-report=json:coverage.json --cov-report=xml:coverage.xml
      - if: runner.os == 'Linux' && matrix.python != '3.12'
        run: xvfb-run -a python -m pytest
      - if: runner.os != 'Linux'
        run: python -m pytest
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_dist.py dist
      - if: runner.os == 'Linux' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: error
  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-badge
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Update measured coverage
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main; leaving its badge alone."
            exit 0
          fi
          python3 scripts/update_coverage_badge.py coverage.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/coverage-badge.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update coverage badge [skip ci]'
            git push origin HEAD:main
          fi
